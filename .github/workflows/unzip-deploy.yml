name: Unzip AEUN Kids deploy
on:
  push:
    paths:
      - 'aeun-kids-deploy.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip package
        run: |
          unzip -o aeun-kids-deploy.zip
          rm aeun-kids-deploy.zip
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy AEUN Kids voice fix" || echo "nothing to commit"
          git push
